<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.json">
  <title>ECE Management — Student Activity, Certificate & Timetable System</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/main.css?v=21">
  <link rel="stylesheet" href="/static/css/timetable.css?v=21">
</head>
<body>
  <!-- Mobile Backdrop Overlay -->
  <div class="mobile-overlay-backdrop" id="mobile-backdrop"></div>

  <div id="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="app-sidebar" style="display: none;">
      <div class="sidebar-header">
        <div class="brand-icon">
          <i class="fa-solid fa-microchip"></i>
        </div>
        <div class="brand-text">
          <h2>ECE Management</h2>
          <span>Student & Activity Portal</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Navigation items injected dynamically by role -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="user-avatar" id="user-avatar-initials">U</div>
          <div class="user-details">
            <h4 id="user-display-name">Loading...</h4>
            <span id="user-display-role">ROLE</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <header class="top-navbar" id="app-navbar" style="display: none;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <button class="mobile-hamburger" id="btn-mobile-menu-toggle">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="page-title" id="page-title">Dashboard</div>
        </div>
        <div class="navbar-actions">
          <span class="badge-role" id="navbar-role-badge">HOD</span>
          <button class="btn btn-secondary btn-sm" id="btn-notifications-toggle">
            <i class="fa-solid fa-bell"></i>
          </button>
          <button class="btn btn-secondary btn-sm" id="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </div>
      </header>

      <!-- View Injection Container -->
      <div id="view-container">
        <!-- Views rendered here dynamically -->
      </div>
    </main>
  </div>

  <!-- Shared Modals -->
  <!-- 1. File Preview Modal -->
  <div class="modal-overlay" id="modal-file-preview">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <h3 id="preview-modal-title">Certificate Preview</h3>
        <button class="modal-close" onclick="closeModal('modal-file-preview')">&times;</button>
      </div>
      <div id="preview-modal-body" style="min-height: 400px; display: flex; justify-content: center; align-items: center;">
      </div>
    </div>
  </div>

  <!-- 2. Rejection Reason Modal -->
  <div class="modal-overlay" id="modal-reject-reason">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Reject Certificate</h3>
        <button class="modal-close" onclick="closeModal('modal-reject-reason')">&times;</button>
      </div>
      <div class="form-group">
        <label>Reason for Rejection <span style="color: var(--accent-rose);">*</span></label>
        <textarea id="reject-reason-input" class="form-control" rows="4" placeholder="Enter reason for rejecting this certificate submission..."></textarea>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
        <button class="btn btn-secondary" onclick="closeModal('modal-reject-reason')">Cancel</button>
        <button class="btn btn-danger" id="btn-confirm-reject">Reject Certificate</button>
      </div>
    </div>
  </div>

  <!-- 3. HOD Lecture Selection Approval Modal -->
  <div class="modal-overlay" id="modal-approve-lectures">
    <div class="modal-content" style="max-width: 650px;">
      <div class="modal-header">
        <h3><i class="fa-solid fa-square-check" style="color: var(--primary);"></i> HOD Approve Certificate — Select Lectures</h3>
        <button class="modal-close" onclick="closeModal('modal-approve-lectures')">&times;</button>
      </div>
      <div style="margin-bottom: 1rem;">
        <p style="font-size: 0.9rem; color: var(--text-muted);" id="approve-modal-subtitle">
          Select which lectures/labs to grant activity attendance credit for:
        </p>
      </div>

      <div id="approve-lectures-list" style="display: flex; flex-direction: column; gap: 0.75rem; max-height: 350px; overflow-y: auto; margin-bottom: 1.5rem; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: var(--radius-md);">
        <!-- Checkboxes injected dynamically -->
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: var(--primary);">
          <input type="checkbox" id="chk-select-all-lectures" checked onchange="TeacherView.toggleSelectAllLectures(this.checked)"> Select All Lectures
        </label>
        <div style="display: flex; gap: 0.75rem;">
          <button class="btn btn-secondary" onclick="closeModal('modal-approve-lectures')">Cancel</button>
          <button class="btn btn-success" id="btn-confirm-approve-lectures"><i class="fa-solid fa-check"></i> Confirm HOD Approval</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. Timetable Cell Add/Edit Modal -->
  <div class="modal-overlay" id="modal-timetable-edit">
    <div class="modal-content" style="max-width: 550px;">
      <div class="modal-header">
        <h3 id="tt-modal-title">Add / Edit Timetable Entry</h3>
        <button class="modal-close" onclick="closeModal('modal-timetable-edit')">&times;</button>
      </div>
      <form id="form-timetable-entry">
        <input type="hidden" id="tt-entry-id">
        <div class="form-group">
          <label>Day of Week</label>
          <select id="tt-day" class="form-control" required>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
          </select>
        </div>
        <div class="form-group">
          <label>Time Slot</label>
          <select id="tt-slot" class="form-control" required></select>
        </div>
        <div class="form-group">
          <label>Activity Type</label>
          <select id="tt-activity-type" class="form-control" required>
            <option value="THEORY">THEORY</option>
            <option value="LAB">LAB</option>
            <option value="TUTORIAL">TUTORIAL</option>
            <option value="LIBRARY">LIBRARY</option>
            <option value="BREAK">BREAK</option>
            <option value="FREE_PERIOD">FREE_PERIOD</option>
          </select>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <select id="tt-subject" class="form-control"></select>
        </div>
        <div class="form-group">
          <label>Batch (Select None for Division-Wide)</label>
          <select id="tt-batch" class="form-control">
            <option value="">All Division (Whole Class)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Teacher</label>
          <select id="tt-teacher" class="form-control"></select>
        </div>
        <div class="form-group">
          <label>Room / Lab Number</label>
          <input type="text" id="tt-room" class="form-control" placeholder="e.g. Room 105, Lab 201">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
          <button type="button" class="btn btn-danger btn-sm" id="btn-delete-tt" style="display: none;">Delete Entry</button>
          <div style="display: flex; gap: 0.75rem; margin-left: auto;">
            <button type="button" class="btn btn-secondary" onclick="closeModal('modal-timetable-edit')">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Entry</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- JavaScript Modules with Cache Buster -->
  <script src="/static/js/api.js?v=21"></script>
  <script src="/static/js/utils/toast.js?v=21"></script>
  <script src="/static/js/utils/exporter.js?v=21"></script>
  <script src="/static/js/views/auth.js?v=21"></script>
  <script src="/static/js/views/student.js?v=21"></script>
  <script src="/static/js/views/teacher.js?v=21"></script>
  <script src="/static/js/views/hod.js?v=21"></script>
  <script src="/static/js/views/timetable.js?v=21"></script>
  <script src="/static/js/views/reports.js?v=21"></script>
  <script src="/static/js/app.js?v=21"></script>
</body>
</html>
